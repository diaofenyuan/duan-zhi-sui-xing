plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file('.local-signing/release.properties')
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace 'com.example.localai'
    compileSdk Integer.parseInt(libs.versions.compileSdk.get())
    buildToolsVersion libs.versions.buildTools.get()
    ndkVersion libs.versions.ndk.get()

    defaultConfig {
        applicationId "com.example.localai"
        minSdk Integer.parseInt(libs.versions.minSdk.get())
        targetSdk Integer.parseInt(libs.versions.targetSdk.get())
        versionCode 2
        versionName "0.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'arm64-v8a'
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            if (releaseSigningFile.isFile()) {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // 计划 4.1：x86_64 仅用于模拟器/专项测试；发布 ABI 保持 arm64-v8a
            ndk {
                abiFilters 'x86_64'
            }
        }
    }

    buildTypes.create('releaseCheck') {
        // 正式签名和 ARM64 Release 配置，独立标识保护现有调试应用的数据。
        initWith buildTypes.release
        applicationIdSuffix '.releasecheck'
        matchingFallbacks = ['release']
    }
    testBuildType providers.gradleProperty('instrumentedBuildType').getOrElse('debug')

    compileOptions {
        sourceCompatibility JavaVersion.valueOf("VERSION_" + libs.versions.javaVersion.get())
        targetCompatibility JavaVersion.valueOf("VERSION_" + libs.versions.javaVersion.get())
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        // P3：AGP 8.0 起 AIDL 默认关闭，独立推理进程协议需要显式开启
        aidl = true
        // P4：设置页显示真实版本号（BuildConfig.VERSION_NAME）
        buildConfig = true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version libs.versions.cmake.get()
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = false
            all {
                // Robolectric 的 android-all 镜像包走阿里云，规避境外直连超时
                systemProperty 'robolectric.dependency.repo.url', 'https://maven.aliyun.com/repository/central'
                maxHeapSize = '1024m'
            }
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType('releaseCheck')) { variant ->
        variant.outputs.each { output ->
            // 仅改变验收包版本，正式包的版本信息保持独立。
            output.versionCode.set(providers.gradleProperty('releaseCheckVersionCode').map { Integer.parseInt(it) }.orElse(2))
        }
    }
}


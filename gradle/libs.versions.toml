# 工具链版本目录（S002 固定）；第三方代码依赖坐标与版本由 S003 登记。
# 登记不等于采用：库只有在对应步骤把依赖写入 app/build.gradle 后才算引入，
# 引入时若需变更版本，必须同步更新 docs/license-policy.md 与 NOTICE。
[versions]
agp = "8.13.2"
compileSdk = "36"
minSdk = "26"
targetSdk = "36"
buildTools = "36.0.0"
javaVersion = "17"
ndk = "28.2.13676358"
cmake = "3.22.1"
kotlin = "2.2.20"

# 代码依赖版本（S003 登记，2026-08-23 核实）
# P1 调整：androidx.core 由 1.19.0 降至 1.16.0——1.19.0 强制要求 compileSdk 37 与 AGP 9.1，
# 与本工程固定工具链（AGP 8.13.2 / compileSdk 36）不兼容；详见 docs/license-policy.md。
androidxCore = "1.16.0"
androidxAppcompat = "1.8.0"
androidxRecyclerview = "1.4.0"
androidxLifecycle = "2.11.0"
androidxRoom = "2.8.4"
androidxWork = "2.11.2"
# P2 调整：okhttp 由 5.5.0 降至 4.12.0——5.5.0 强制 compileSdk 37（本工程固定 compileSdk 36 / AGP 8.13.2，最大建议 36）；
# 4.12.0 为 4.x 稳定线最终版，Range/ETag/流式下载 API 与本项目所需完全一致；详见 docs/license-policy.md。
okhttp = "4.12.0"
material = "1.12.0"
junit = "4.13.2"

# P2 引入：Gson（App JSON 解析，Apache-2.0）；Robolectric/androidx.test 仅测试域
gson = "2.11.0"
robolectric = "4.16"
androidxTestCore = "1.6.1"

# P3 引入：androidx.test runner/rules/ext-junit 仅 androidTest 域（仪器化测试基础设施）
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
androidxTestJunit = "1.2.1"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "androidxRecyclerview" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "androidxLifecycle" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidxRoom" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidxRoom" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "androidxWork" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
